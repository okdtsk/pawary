name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # the CLOUDFLARE_API_TOKEN secret lives in this environment, which is
    # branch-restricted to main — no other ref can read it
    environment: production
    # one deploy at a time; a newer push supersedes a queued older one
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      # npm ci and the build run WITHOUT the API token in env: dependency
      # (post)install scripts must never see deploy credentials
      - run: npm ci
      - run: npm run build
        # surface the deployed commit in the app UI (Settings → Version)
        env:
          APP_COMMIT_SHA: ${{ github.sha }}
      - name: Apply pending D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 15e92cf7a2d85b77cd798213277382d2
        run: npx wrangler d1 migrations apply pawary --remote --env production
      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 15e92cf7a2d85b77cd798213277382d2
        run: npx wrangler deploy --env production
