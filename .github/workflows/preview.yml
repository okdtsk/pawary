name: Preview

on:
  # Manual fallback: Actions -> Preview -> Run workflow -> pick a branch.
  workflow_dispatch:
  # QA signal: add the `preview` label to a PR to deploy its branch to preview.
  pull_request:
    types: [labeled]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy on a manual run, or when the label added is exactly `preview`
    # (other labels must not trigger a deploy).
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'preview'
    # the CLOUDFLARE_API_TOKEN secret lives in this environment; unlike
    # `production` it is NOT branch-restricted, so any feature branch can deploy
    environment: preview
    # one preview deploy at a time; a newer run supersedes an older queued one
    concurrency:
      group: deploy-preview
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # For a `preview`-labeled PR, deploy the PR's head commit; for a
          # manual run, checkout defaults to the selected branch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        # surface the deployed commit in the app UI (Settings → Version); on a
        # PR event github.sha is a synthetic merge commit, so use the head sha
        env:
          APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # npm ci and the build above run WITHOUT the API token in env, so
      # dependency (post)install scripts never see deploy credentials
      - name: Apply pending D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 15e92cf7a2d85b77cd798213277382d2
        run: npx wrangler d1 migrations apply pawary-preview --remote --env preview
      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 15e92cf7a2d85b77cd798213277382d2
        run: npx wrangler deploy --env preview
